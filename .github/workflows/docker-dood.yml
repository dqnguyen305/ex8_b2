name: Docker DooD verification

on:
  push:

permissions:
  contents: read

jobs:
  docker:
    runs-on: [self-hosted, linux, x64, docker]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify host Docker daemon access
        run: docker info

      - name: Build Spring Boot image
        run: docker build --file demo/Dockerfile --tag quickbite-springboot:${GITHUB_SHA} demo
